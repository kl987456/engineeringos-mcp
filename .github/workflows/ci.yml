name: EngineeringOS CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test,parsing,parsing-pack]"
      - run: python -c "import tree_sitter_language_pack as t; t.prefetch(['kotlin', 'lua', 'bash', 'dart'])"
      - run: pytest -q tests
      - run: python -m engineeringos.evaluations sample-repo
      - run: python -m compileall -q engineeringos
